<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People Data Table</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="data-page">
    <main>
      <h1>People directory</h1>
      <p class="intro">Search the list or sort it by name and age.</p>
      <div class="toolbar">
        <label class="visually-hidden" for="search">Search people</label>
        <input
          id="search"
          type="search"
          placeholder="Search by name, age, or city…"
        />
        <button id="sort-name" type="button" aria-pressed="false">
          Sort by name
        </button>
        <button id="sort-age" type="button" aria-pressed="false">
          Sort by age
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Age</th>
              <th scope="col">City</th>
            </tr>
          </thead>
          <tbody id="people-rows"></tbody>
        </table>
      </div>
      <p id="result-count" role="status" aria-live="polite"></p>
      <nav><a href="index.html">Back to registration</a></nav>
    </main>
    <script src="data.js"></script>
  </body>
</html>
